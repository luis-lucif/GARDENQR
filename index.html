<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Garden</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100-vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
        }
        h1 { color: #333; }
        p { color: #666; margin-bottom: 2rem; }
        .btn {
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bienvenidos</h1>
        <p>Haz clic abajo para ver nuestra carta completa</p>
        <!-- ASEGÚRATE DE QUE EL NOMBRE DEL ARCHIVO COINCIDA EXACTAMENTE -->
        <a href="menu-restaurant.pdf" class="btn">Ver Menú PDF</a>
    </div>

</body>
</html>
